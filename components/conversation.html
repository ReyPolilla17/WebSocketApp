<input type="hidden" name="oppened-chat" id="oppened-chat" value="{CHAT_ID}">

<div class="chat-info-wrapper">
    <div class="image-wrapper">
        {CHAT_IMAGE}
    </div>
    <h1>{CHAT_NAME}</h1>
</div>

<div id="messages-wrapper">
    {MESSAGE_LIST}
</div>

<div class="send-bar">
    <form onsubmit="return sendMessage({CHAT_ID})">
        <div class="send-form">
            <input type="text" name="send-message" id="send-message" placeholder="Mensaje..." autocomplete="off">
            <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </form>
</div>
