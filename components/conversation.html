<div class="chat-info-wrapper">
    {CHAT_IMAGE}
    {CHAT_NAME}
</div>

<div id="messages-wrapper">
    {MESSAGE_LIST}
</div>

<div class="send-bar">
    <form onsubmit="return sendMessage({CHAT_ID})">
        <input type="text" name="send-message" id="send-message" placeholder="Mensaje...">
        <button type="submit">Enviar</button>
    </form>
</div>
