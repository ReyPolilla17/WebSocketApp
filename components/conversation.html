<div class="chat-info-wrapper">
    {CHAT_IMAGE}
    {CHAT_NAME}
</div>

<div class="messages-wrapper">
    <!-- BEGIN OTHER_MESSAGES -->
     <div class="other-message">
        {ID}
        {AUTHOR_NAME}
        {AUTHOR_IMAGE}
        {CONTENT}
        {TIMESTAMP}
    </div>
    <!-- END OTHER_MESSAGES -->
    
    <!-- BEGIN YOUR_MESSAGES -->
    <div class="your-message">
        {ID}
        {AUTHOR_IMAGE}
        {CONTENT}
        {TIMESTAMP}
     </div>
    <!-- END YOUR_MESSAGES -->
</div>

<div class="send-bar">
    <form onsubmit="sendMessage()">
        <input type="text" name="send-message" id="send-message" placeholder="Mensaje...">
        <button type="submit">Enviar</button>
    </form>
</div>
