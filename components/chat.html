<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>What is App?</title>

    <link rel="shortcut icon" href="./media/logos/favicon.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./styles/common.css">
    <link rel="stylesheet" href="./styles/dashboard.css">
    <link rel="stylesheet" href="./styles/chat-creation.css">
    <link rel="stylesheet" href="./styles/vertical-screen.css">

    <script src="https://kit.fontawesome.com/9e78df03eb.js" crossorigin="anonymous"></script>

    <script src="https://code.jquery.com/jquery-4.1.0.min.js"></script>
    <script src="./scripts/autobahn.js"></script>
    
    <script src="./scripts/scripts.js"></script>
    <script src="./scripts/setup.js"></script>
    
    <script>initUser('{USER}', '{PASS}')</script>
    
    <script src="./scripts/chat-openning.js" defer></script>
    <script src="./scripts/chat-creation.js" defer></script>
    <script src="./scripts/chat-sending.js" defer></script>
    <script src="./scripts/chat-filtering.js" defer></script>
</head>
<body>
    <div class="content-wrapper">
        <div class="chat-bar">
            <div class="chat-topbar">
                <div class="send-form">
                    <input type="text" name="chat-search" id="chat-search" placeholder="Buscar chat..." onkeyup="filterChats()">
                    <button onclick="openChatCreation()"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>

            <div id="chat-collection">
                {CHATS_LIST}
            </div>
        </div>

        <div id="chat-wrapper">
            {CHAT}
        </div>
    </div>
</body>
</html>
